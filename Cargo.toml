[workspace]
members = ["crates/daw-domain", "crates/daw-engine", "crates/daw-audio", "crates/daw-app", "crates/daw-cli", "src-tauri"]
default-members = ["crates/daw-domain", "crates/daw-engine", "crates/daw-audio", "crates/daw-app", "crates/daw-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
daw-domain = { path = "crates/daw-domain" }
daw-engine = { path = "crates/daw-engine" }
daw-audio = { path = "crates/daw-audio" }
cpal = { version = "=0.18.2", default-features = false }
rtrb = "=0.4.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ts-rs = "=12.0.1"
daw-app = { path = "crates/daw-app" }
tauri = { version = "=2.12.5" }
tauri-build = { version = "=2.7.4" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
